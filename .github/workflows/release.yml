name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test "$GITHUB_REF_NAME" = "v$version"
      - run: cargo test --locked --all-targets --target ${{ matrix.target }}
      - run: cargo build --locked --release --bin potoo-linotte --target ${{ matrix.target }}
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          else
            version="$GITHUB_REF_NAME"
          fi
          bundle="potoo-linotte-interpreter-${version}-${TARGET}"
          mkdir -p "$bundle"
          cp "target/${TARGET}/release/potoo-linotte" "$bundle/"
          tar -czf "$bundle.tar.gz" "$bundle"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          } else {
            $version = $env:GITHUB_REF_NAME
          }
          $bundle = "potoo-linotte-interpreter-$version-$env:TARGET"
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item "target/$env:TARGET/release/potoo-linotte.exe" -Destination $bundle
          Compress-Archive -Path $bundle -DestinationPath "$bundle.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: potoo-linotte-interpreter-*-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          cd release-assets
          sha256sum *.tar.gz *.zip > SHA256SUMS
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" *.tar.gz *.zip SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" *.tar.gz *.zip SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --title "Linotte interpreter $tag" \
              --notes "Standalone CLI for Linotte 3.14. Verified targets: Linux x86_64 GNU, Windows x86_64 MSVC, and macOS Intel x86_64. Apple silicon and universal macOS binaries are not included. Each archive contains the CLI executable; SHA256SUMS contains checksums."
          fi
