[package]
name = "potoo-linotte-interpreter"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
repository = "https://github.com/diegopn/potoo-linotte-interpreter"
readme = "README.md"
description = "Initial scaffold for an independent Rust interpreter for the Linotte programming language"

[lib]
path = "src/lib.rs"

[[bin]]
name = "potoo-linotte"
path = "src/bin/potoo-linotte.rs"
