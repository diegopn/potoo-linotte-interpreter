[package]
name = "potoo-linotte-interpreter"
version = "0.1.1"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
repository = "https://github.com/diegopn/potoo-linotte-interpreter"
readme = "README.md"
description = "A Rust interpreter for the educational Linotte programming language"

[dependencies]
bigdecimal = "0.4.11"

[lib]
path = "src/lib.rs"

[[bin]]
name = "potoo-linotte"
path = "src/bin/potoo-linotte.rs"
